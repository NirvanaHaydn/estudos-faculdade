name: Atualizar Dashboard do README

on:
  schedule:
    
    - cron: "0 12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "scripts/update_dashboard.py"

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar script de atualização do dashboard
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python scripts/update_dashboard.py

      - name: Commitar e enviar alterações no README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: atualizar dashboard do projeto automaticamente"
          git push